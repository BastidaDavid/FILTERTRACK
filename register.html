

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiltraCore | Registro Empresa</title>
  <link rel="stylesheet" href="style_login.css" />
</head>
<body class="login-page">

  <div class="login-container">

    <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:20px;">
      <img src="imgs/logo.png" alt="FiltraCore Logo" style="width:120px; height:120px; object-fit:cover; border-radius:20px; margin-bottom:15px;" />
      <h1 style="margin:0;" data-i18n="registerTitle">Registrar Empresa</h1>
      <p style="opacity:0.7; font-size:14px; margin-top:8px;" data-i18n="registerSubtitle">Crear nueva organización en FiltraCore</p>
    </div>

    <form id="register-form" class="login-form">

      <div class="input-group">
        <input id="company_name" type="text" placeholder="Nombre de la Empresa" data-i18n-placeholder="companyName" required />
      </div>

      <div class="input-group">
        <input id="machine_limit" type="number" placeholder="Límite de Máquinas (según contrato)" data-i18n-placeholder="machineLimit" required />
      </div>

      <div class="input-group">
        <input id="user_id" type="text" placeholder="Usuario Admin" data-i18n-placeholder="adminUser" required />
      </div>

      <div class="input-group">
        <input id="password" type="password" placeholder="Contraseña" data-i18n-placeholder="password" required />
      </div>

      <button type="submit" data-i18n="createCompany">Crear Empresa</button>
      <button type="button" id="back-login" data-i18n="backLogin" style="margin-top:10px; background:#222;">Volver al Login</button>

    </form>
  </div>

  <script>
    const API = 'http://localhost:3000';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const company_name = document.getElementById('company_name').value;
      const machine_limit = document.getElementById('machine_limit').value;
      const user_id = document.getElementById('user_id').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            company_name,
            machine_limit,
            user_id,
            password
          })
        });

        const data = await res.json();

        if (data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('company', JSON.stringify(data.company));
          window.location.href = 'index.html';
        } else {
          alert(data.error || 'Error al registrar');
        }

      } catch (err) {
        alert('Error conectando con el servidor');
        console.error(err);
      }
    });

    document.getElementById('back-login').addEventListener('click', () => {
      window.location.href = 'login.html';
    });

    // 🌍 Register translation system
    const registerTranslations = {
      es: {
        registerTitle: "Registrar Empresa",
        registerSubtitle: "Crear nueva organización en FiltraCore",
        companyName: "Nombre de la Empresa",
        machineLimit: "Límite de Máquinas (según contrato)",
        adminUser: "Usuario Admin",
        password: "Contraseña",
        createCompany: "Crear Empresa",
        backLogin: "Volver al Login"
      },
      en: {
        registerTitle: "Register Company",
        registerSubtitle: "Create new organization in FiltraCore",
        companyName: "Company Name",
        machineLimit: "Machine Limit (according to contract)",
        adminUser: "Admin Username",
        password: "Password",
        createCompany: "Create Company",
        backLogin: "Back to Login"
      }
    };

    function applyRegisterTranslations() {
      const lang = localStorage.getItem('lang') || 'es';
      const langData = registerTranslations[lang];

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (langData[key]) el.textContent = langData[key];
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (langData[key]) el.placeholder = langData[key];
      });
    }

    applyRegisterTranslations();
  </script>

</body>
</html>
