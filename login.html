<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FilterTrack | Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

 

  <div class="login-container">
      <h1>FilterTrack</h1>
      <p style="opacity:0.7; font-size:14px; margin-bottom:20px;">Sistema de Gestión de Filtros</p>

      <form id="login-form" class="login-form">
        <div class="input-group">
          <input id="user" type="text" placeholder="Usuario" required />
        </div>

        <div class="input-group">
          <input id="pass" type="password" placeholder="Contraseña" required />
        </div>

        <button type="submit">Entrar</button>
      </form>
  </div>

  <script>
    const API = 'https://filtertrack-backend.onrender.com';

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: document.getElementById('user').value,
            password: document.getElementById('pass').value,
            org_id: "STRAT01"
          })
        });

        const data = await res.json();

        if (data.token) {
          localStorage.setItem('token', data.token);
          window.location.href = 'index.html';
        } else {
          alert(data.error || 'Credenciales inválidas');
        }

      } catch (err) {
        alert('Error conectando con el servidor');
        console.error(err);
      }
    });
  </script>

</body>
</html>
