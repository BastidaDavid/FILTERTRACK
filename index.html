<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <base href="./">
  <title>Dashboard – Sistema de Filtros</title>
  <link rel="stylesheet" href="style_index.css" />
</head>
<body>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }
  </script>

  <div class="layout">
    <div class="col-filtros">
      <h1 class="app-title">FILTERTRACK</h1>
      <button id="btn-logout" style="float:right;">Cerrar sesión</button>

      <form id="form-filtro">
        <h2>Agregar filtro (V1)</h2>

        <input type="text" id="filter-id" name="filter_id" placeholder="Filter ID (ej. FT-BAR-ICE-001)" required />
        <input type="text" id="area" name="area" placeholder="Área (ej. BAR)" required />
        <input type="text" id="equipment" name="equipment" placeholder="Equipo/Máquina (ej. ICE-01)" required />
        <input type="text" id="location" name="location" placeholder="Ubicación exacta" required />

        <input type="text" id="brand" name="brand" placeholder="Marca" required />
        <input type="text" id="model" name="model" placeholder="Modelo" required />

        <input type="date" id="install-date" name="install_date" required />
        <input type="number" id="life-months" name="life_months" placeholder="Vida útil (meses)" min="1" step="1" required />

        <input type="text" id="responsible" name="responsible" placeholder="Responsable (iniciales o nombre)" required />
        <input type="text" id="notes" name="notes" placeholder="Notas (opcional)" />

        <button type="submit">Guardar filtro</button>
        <button type="button" id="btn-limpiar">Limpiar campos</button>
      </form>

      <div class="estado-bar">
        <button class="estado-btn activo" data-estado="all">
          Todos (<span id="count-all">0</span>)
        </button>

        <button class="estado-btn" data-estado="proximo">
          Próximos (<span id="count-proximo">0</span>)
        </button>

        <button class="estado-btn" data-estado="vencido">
          Vencidos (<span id="count-vencido">0</span>)
        </button>
      </div>

      <div class="reporte-actions">
        <button type="button" id="btn-reporte-pdf" class="btn-reporte" title="Descargar reporte en PDF">
          📄 PDF
        </button>

        <button type="button" id="btn-reporte-excel" class="btn-reporte" title="Descargar reporte en Excel">
          📊 Excel
        </button>
      </div>

      <table id="tabla-filtros">
        <thead>
          <tr>
            <th>Filter ID</th>
            <th>Área</th>
            <th>Equipo</th>
            <th>Ubicación</th>
            <th>Marca/Modelo</th>
            <th>Instalación</th>
            <th>Vence</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- JS inserta filas aquí -->
        </tbody>
      </table>
    </div>

    <div class="col-mantenimientos" style="display:none;">
      <button id="btn-cerrar-panel" style="float:right;">✕</button>
      <h2>Historial del filtro</h2>
      <div class="reporte-actions">
        <button type="button" id="btn-reporte-historial-pdf" class="btn-reporte" title="Descargar historial en PDF">
          📄 Historial PDF
        </button>

        <button type="button" id="btn-reporte-historial-excel" class="btn-reporte" title="Descargar historial en Excel">
          📊 Historial Excel
        </button>
      </div>

      <div id="seccion-mantenimientos" style="display:none;">
        <h3 id="titulo-mantenimientos"></h3>

        <form id="form-mantenimiento">
          <input type="date" id="mant-fecha" required />
          <select id="mant-motivo" required>
            <option value="">Motivo</option>
            <option value="Programado">Programado</option>
            <option value="Emergencia">Emergencia</option>
            <option value="Calidad">Calidad</option>
            <option value="Flujo bajo">Flujo bajo</option>
            <option value="Daño">Daño</option>
            <option value="Otro">Otro</option>
          </select>
          <input type="text" id="mant-responsable" placeholder="Responsable" required />
          <input type="text" id="mant-observaciones" placeholder="Notas / Observaciones" />
          <button type="submit">Guardar evento</button>
        </form>

        <table id="tabla-mantenimientos">
          <thead>
            <tr>
              <th>ID</th>
              <th>Fecha</th>
              <th>Motivo</th>
              <th>Responsable</th>
              <th>Notas</th>
            </tr>
          </thead>
          <tbody>
            <!-- JS inserta mantenimientos aquí -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    document.getElementById('btn-logout')?.addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });
  </script>
  <script src="script.js"></script>
  <div id="overlay" class="overlay"></div>
</body>
</html>
